<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" preserveAspectRatio="xMinYMid meet" role="img" aria-label="fdk-labs">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a855f7;#ec4899;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#22d3ee;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#22d3ee;#a855f7;#ec4899" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9">
        <animate attributeName="stop-color" values="#67e8f9;#c084fc;#f472b6;#67e8f9" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#22d3ee;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .bender { font: 700 16px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: url(#metal); filter: url(#glow); }
    .eye { fill: #22d3ee; filter: url(#glow); }
    .ball { fill: #ec4899; filter: url(#glow); animation: blink 2.4s steps(1) infinite; }
    .title { font: 900 84px/1 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif; letter-spacing: -3px; fill: url(#g); filter: url(#glow); }
    .caret { font: 900 84px/1 ui-sans-serif, system-ui, sans-serif; fill: #22d3ee; filter: url(#glow); animation: blink 1s steps(1) infinite; }
    .tag { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 5px; text-transform: uppercase; fill: #94a3b8; }
    @keyframes blink { 50% { opacity: 0.2; } }
  </style>

  <text class="bender" x="16" y="42" xml:space="preserve"><tspan x="16" dy="0">    T</tspan><tspan x="16" dy="1em">  .-"-.</tspan><tspan x="16" dy="1em"> |  ___|</tspan><tspan x="16" dy="1em"> | (<tspan class="eye">.\/.</tspan>)</tspan><tspan x="16" dy="1em"> |  ,,,'</tspan><tspan x="16" dy="1em"> | '###</tspan><tspan x="16" dy="1em">  '----'</tspan></text>

  <text class="title" x="190" y="108">fdk-labs</text>
  <text class="tag" x="194" y="138">// ai coding toolbox · digdir</text>
</svg>
